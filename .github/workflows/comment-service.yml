name: comment-service

on:
  push:
    branches: [main]
    paths:
      - 'services/comment-service/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=services/comment-service

      - name: Build image
        run: docker build -f services/comment-service/Dockerfile -t mini-tube/comment-service:${{ github.sha }} .

      - name: Push image
        run: echo "push mini-tube/comment-service:${{ github.sha }} to registry"

      - name: Deploy
        run: echo "deploy comment-service (e.g. docker compose pull && up, or kubectl set image)"
