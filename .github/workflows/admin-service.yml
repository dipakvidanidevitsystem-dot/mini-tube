name: admin-service

on:
  push:
    branches: [main]
    paths:
      - 'backend/services/admin-service/**'
      - 'backend/shared/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=@mini-tube/admin-service

      - name: Build image
        run: docker build -f backend/services/admin-service/Dockerfile -t mini-tube/admin-service:${{ github.sha }} .

      - name: Push image
        run: echo "push mini-tube/admin-service:${{ github.sha }} to registry"

      - name: Deploy
        run: echo "deploy admin-service"
