# Local dev stack for the microservices migration (see the plan for step numbers).
# Runs alongside docker-compose.yml (the still-live monolith) — the gateway
# defaults every route to MONOLITH_URL until a given service is actually
# extracted and given its own *_SERVICE_URL. auth-service,
# notification-service, video-service, comment-service, and history-service
# are real extractions already; the rest are stubs gated behind Compose
# profiles until they're extracted for real.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.microservices.yml up

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL}
      JWT_SECRET: ${JWT_SECRET}
      MONOLITH_URL: http://server:${PORT}
      AUTH_SERVICE_URL: http://auth-service:5011
      USER_SERVICE_URL:
      VIDEO_SERVICE_URL: http://video-service:5013
      COMMENT_SERVICE_URL: http://comment-service:5014
      HISTORY_SERVICE_URL: http://history-service:5015
      ADMIN_SERVICE_URL:
    depends_on:
      - server
      - video-service
      - comment-service
      - history-service
    ports:
      - "5000:5000"

  # Actually extracted (migration plan step 3) — runs by default alongside the monolith.
  # Still points at the same shared MySQL instance/tables as the monolith; the
  # "database per service" split is a later step once User Service is also extracted.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5011
      CLIENT_URL: ${CLIENT_URL}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5011:5011"

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5012
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    profiles: ["user-service"]

  # Actually extracted (migration plan step 4) — runs by default alongside the monolith.
  video-service:
    build:
      context: .
      dockerfile: services/video-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5013
      CLIENT_URL: ${CLIENT_URL}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      NOTIFICATION_SERVICE_URL: http://notification-service:5017
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5013:5013"

  # Actually extracted (migration plan step 5) — runs by default alongside the monolith.
  comment-service:
    build:
      context: .
      dockerfile: services/comment-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5014
      CLIENT_URL: ${CLIENT_URL}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      NOTIFICATION_SERVICE_URL: http://notification-service:5017
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5014:5014"

  # Actually extracted (migration plan step 6) — runs by default alongside the monolith.
  history-service:
    build:
      context: .
      dockerfile: services/history-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5015
      CLIENT_URL: ${CLIENT_URL}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5015:5015"

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5016
      JWT_SECRET: ${JWT_SECRET}
    profiles: ["admin-service"]

  # Actually extracted (migration plan step 2) — runs by default alongside the monolith.
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5017
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "5017:5017"
